<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Daily vault cash deposits</title>
<desc id="d">Cash withdrawn from an ATM is deposited to the owner's bank account the next business day.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ee"/><stop offset="1" stop-color="#ece6da"/></linearGradient>
 <linearGradient id="atm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f427a"/><stop offset="1" stop-color="#002868"/></linearGradient>
 <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f8f5b"/><stop offset="1" stop-color="#2d6e45"/></linearGradient>
 <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#002868" flood-opacity=".18"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bf0a30"/></marker>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<circle cx="180" cy="150" r="130" fill="#ffd24d" opacity=".18"/>
<circle cx="1040" cy="780" r="120" fill="#002868" opacity=".08"/>

<!-- ATM -->
<g filter="url(#sh)">
 <rect x="130" y="180" width="300" height="560" rx="22" fill="url(#atm)"/>
 <rect x="150" y="200" width="260" height="60" rx="10" fill="#bf0a30"/>
 <text x="280" y="240" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">ATM</text>
 <rect x="160" y="284" width="240" height="150" rx="10" fill="#dfe9f7"/>
 <rect x="176" y="300" width="208" height="14" rx="4" fill="#002868" opacity=".7"/>
 <rect x="176" y="326" width="140" height="10" rx="4" fill="#002868" opacity=".35"/>
 <rect x="176" y="346" width="180" height="10" rx="4" fill="#002868" opacity=".35"/>
 <rect x="176" y="366" width="110" height="10" rx="4" fill="#002868" opacity=".35"/>
 <text x="280" y="418" text-anchor="middle" fill="#002868" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Withdraw $100</text>
 <!-- keypad -->
 <g fill="#385789">
  <rect x="176" y="460" width="52" height="30" rx="6"/><rect x="238" y="460" width="52" height="30" rx="6"/><rect x="300" y="460" width="52" height="30" rx="6"/>
  <rect x="176" y="500" width="52" height="30" rx="6"/><rect x="238" y="500" width="52" height="30" rx="6"/><rect x="300" y="500" width="52" height="30" rx="6"/>
  <rect x="176" y="540" width="52" height="30" rx="6"/><rect x="238" y="540" width="52" height="30" rx="6"/><rect x="300" y="540" width="52" height="30" rx="6"/>
 </g>
 <rect x="362" y="460" width="38" height="30" rx="6" fill="#bf0a30"/>
 <rect x="362" y="500" width="38" height="30" rx="6" fill="#ffd24d"/>
 <!-- cash slot with bills -->
 <rect x="160" y="600" width="240" height="30" rx="8" fill="#001c49"/>
 <rect x="184" y="588" width="192" height="24" rx="4" fill="url(#bill)"/>
 <rect x="190" y="580" width="180" height="20" rx="4" fill="#4aa46b"/>
 <circle cx="280" cy="590" r="7" fill="#e6f2ea" opacity=".8"/>
 <rect x="160" y="660" width="240" height="40" rx="8" fill="#1a3e77"/>
</g>

<!-- flow arrow with calendar -->
<path d="M470 450 C 560 450, 560 450, 650 450" stroke="#bf0a30" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#sh)">
 <rect x="490" y="300" width="150" height="120" rx="16" fill="#fff"/>
 <rect x="490" y="300" width="150" height="34" rx="16" fill="#bf0a30"/>
 <rect x="490" y="318" width="150" height="16" fill="#bf0a30"/>
 <rect x="516" y="290" width="12" height="26" rx="6" fill="#002868"/><rect x="602" y="290" width="12" height="26" rx="6" fill="#002868"/>
 <text x="565" y="384" text-anchor="middle" fill="#002868" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">DAILY</text>
 <text x="565" y="408" text-anchor="middle" fill="#5b6172" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">NEXT BUSINESS DAY</text>
</g>
<!-- flying bills -->
<g transform="rotate(-12 560 520)">
 <rect x="500" y="500" width="120" height="52" rx="6" fill="url(#bill)"/>
 <rect x="510" y="508" width="100" height="36" rx="4" fill="none" stroke="#bfe3cb" stroke-width="2"/>
 <circle cx="560" cy="526" r="11" fill="#bfe3cb" opacity=".9"/>
 <text x="560" y="531" text-anchor="middle" fill="#2d6e45" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">$</text>
</g>
<g transform="rotate(8 610 590)">
 <rect x="550" y="566" width="120" height="52" rx="6" fill="#4aa46b"/>
 <rect x="560" y="574" width="100" height="36" rx="4" fill="none" stroke="#bfe3cb" stroke-width="2"/>
 <circle cx="610" cy="592" r="11" fill="#bfe3cb" opacity=".9"/>
 <text x="610" y="597" text-anchor="middle" fill="#2d6e45" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">$</text>
</g>

<!-- bank -->
<g filter="url(#sh)">
 <polygon points="700,330 890,240 1080,330" fill="#002868"/>
 <rect x="712" y="330" width="356" height="26" fill="#1a3e77"/>
 <rect x="712" y="356" width="356" height="330" fill="#fff"/>
 <g fill="#dfe3ee">
  <rect x="740" y="380" width="44" height="260" rx="6"/><rect x="812" y="380" width="44" height="260" rx="6"/><rect x="956" y="380" width="44" height="260" rx="6"/><rect x="1004" y="380" width="30" height="260" rx="6"/>
 </g>
 <rect x="700" y="640" width="380" height="46" rx="6" fill="#002868"/>
 <rect x="690" y="686" width="400" height="24" rx="6" fill="#1a3e77"/>
 <rect x="876" y="540" width="60" height="100" rx="8" fill="#bf0a30"/><rect x="890" y="556" width="32" height="40" rx="4" fill="#ffd24d" opacity=".9"/>
 <text x="890" y="312" text-anchor="middle" fill="#ffd24d" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="3">YOUR BANK</text>
</g>
<!-- deposit badge -->
<g filter="url(#sh)">
 <rect x="770" y="740" width="240" height="64" rx="32" fill="#fff"/>
 <circle cx="806" cy="772" r="18" fill="#1f9d55"/>
 <path d="M797 772l7 7 12-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="836" y="767" fill="#5b6172" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">DEPOSIT RECEIVED</text>
 <text x="836" y="790" fill="#002868" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">+ $2,340.00</text>
</g>
</svg>
