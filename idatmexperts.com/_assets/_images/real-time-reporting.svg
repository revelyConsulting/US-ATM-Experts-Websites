<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Real-time ATM reporting dashboard</title>
<desc id="d">A laptop and phone showing cash remaining, surcharge revenue, and recent transactions.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ee"/><stop offset="1" stop-color="#ece6da"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f2ed"/></linearGradient>
 <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#971d27"/><stop offset="1" stop-color="#c54b54"/></linearGradient>
 <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1c3f94" flood-opacity=".18"/></filter>
 <clipPath id="lap"><rect x="200" y="150" width="760" height="470" rx="14"/></clipPath>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<circle cx="1010" cy="160" r="140" fill="#f2c94c" opacity=".18"/>
<circle cx="150" cy="760" r="110" fill="#1c3f94" opacity=".08"/>

<!-- laptop -->
<g filter="url(#sh)">
 <rect x="180" y="130" width="800" height="510" rx="26" fill="#1c3f94"/>
 <rect x="200" y="150" width="760" height="470" rx="14" fill="url(#screen)"/>
 <rect x="110" y="640" width="940" height="26" rx="13" fill="#33529f"/>
 <rect x="500" y="640" width="160" height="8" rx="4" fill="#142c68"/>
</g>
<g clip-path="url(#lap)" font-family="Inter, Arial, sans-serif">
 <!-- top bar -->
 <rect x="200" y="150" width="760" height="56" fill="#1c3f94"/>
 <circle cx="232" cy="178" r="12" fill="#b8232f"/>
 <text x="256" y="184" fill="#fff" font-size="18" font-weight="700">Idaho ATM Experts · Live Dashboard</text>
 <circle cx="900" cy="178" r="6" fill="#4ade80"/><text x="914" y="183" fill="#cfd6ea" font-size="13">LIVE</text>

 <!-- cash remaining card -->
 <rect x="228" y="232" width="220" height="150" rx="14" fill="#fff" stroke="#e6e1d8"/>
 <text x="248" y="262" fill="#5b6172" font-size="13" font-weight="600" letter-spacing="1">CASH REMAINING</text>
 <text x="248" y="312" fill="#1c3f94" font-size="40" font-weight="800">$6,420</text>
 <rect x="248" y="338" width="180" height="12" rx="6" fill="#efe9dd"/>
 <rect x="248" y="338" width="122" height="12" rx="6" fill="#f2c94c"/>
 <text x="248" y="370" fill="#5b6172" font-size="12">68% of 2,000-note cassette</text>

 <!-- surcharge revenue card -->
 <rect x="470" y="232" width="220" height="150" rx="14" fill="#fff" stroke="#e6e1d8"/>
 <text x="490" y="262" fill="#5b6172" font-size="13" font-weight="600" letter-spacing="1">SURCHARGE REVENUE</text>
 <text x="490" y="312" fill="#1c3f94" font-size="40" font-weight="800">$1,284</text>
 <text x="490" y="344" fill="#1f9d55" font-size="14" font-weight="700">▲ 12% vs. last month</text>
 <text x="490" y="370" fill="#5b6172" font-size="12">Month to date</text>

 <!-- transactions card -->
 <rect x="712" y="232" width="220" height="150" rx="14" fill="#fff" stroke="#e6e1d8"/>
 <text x="732" y="262" fill="#5b6172" font-size="13" font-weight="600" letter-spacing="1">WITHDRAWALS TODAY</text>
 <text x="732" y="312" fill="#1c3f94" font-size="40" font-weight="800">37</text>
 <text x="732" y="344" fill="#5b6172" font-size="14">Avg. $84 per withdrawal</text>
 <text x="732" y="370" fill="#5b6172" font-size="12">Last: 2 min ago</text>

 <!-- bar chart -->
 <rect x="228" y="404" width="462" height="200" rx="14" fill="#fff" stroke="#e6e1d8"/>
 <text x="248" y="432" fill="#5b6172" font-size="13" font-weight="600" letter-spacing="1">DAILY WITHDRAWALS · LAST 14 DAYS</text>
 <g fill="url(#bar)">
  <rect x="252" y="540" width="22" height="46" rx="4"/><rect x="282" y="524" width="22" height="62" rx="4"/><rect x="312" y="532" width="22" height="54" rx="4"/><rect x="342" y="500" width="22" height="86" rx="4"/><rect x="372" y="478" width="22" height="108" rx="4"/><rect x="402" y="466" width="22" height="120" rx="4"/><rect x="432" y="510" width="22" height="76" rx="4"/><rect x="462" y="528" width="22" height="58" rx="4"/><rect x="492" y="516" width="22" height="70" rx="4"/><rect x="522" y="494" width="22" height="92" rx="4"/><rect x="552" y="472" width="22" height="114" rx="4"/><rect x="582" y="456" width="22" height="130" rx="4"/><rect x="612" y="448" width="22" height="138" rx="4"/><rect x="642" y="470" width="22" height="116" rx="4"/>
 </g>
 <line x1="248" y1="586" x2="672" y2="586" stroke="#e6e1d8" stroke-width="2"/>

 <!-- recent list -->
 <rect x="712" y="404" width="220" height="200" rx="14" fill="#fff" stroke="#e6e1d8"/>
 <text x="732" y="432" fill="#5b6172" font-size="13" font-weight="600" letter-spacing="1">RECENT</text>
 <g fill="#1c3f94" font-size="14">
  <text x="732" y="464">Withdrawal</text><text x="912" y="464" text-anchor="end" font-weight="700">$100</text>
  <text x="732" y="494">Withdrawal</text><text x="912" y="494" text-anchor="end" font-weight="700">$60</text>
  <text x="732" y="524">Balance inquiry</text><text x="912" y="524" text-anchor="end" font-weight="700">—</text>
  <text x="732" y="554">Withdrawal</text><text x="912" y="554" text-anchor="end" font-weight="700">$120</text>
  <text x="732" y="584">Withdrawal</text><text x="912" y="584" text-anchor="end" font-weight="700">$40</text>
 </g>
 <g fill="#8a90a0" font-size="11"><text x="732" y="478">2 min ago</text><text x="732" y="508">9 min ago</text><text x="732" y="538">14 min ago</text><text x="732" y="568">22 min ago</text><text x="732" y="598">31 min ago</text></g>
</g>

<!-- phone -->
<g filter="url(#sh)" font-family="Inter, Arial, sans-serif">
 <rect x="880" y="420" width="220" height="420" rx="30" fill="#1c3f94"/>
 <rect x="894" y="436" width="192" height="388" rx="20" fill="#fff"/>
 <rect x="950" y="446" width="80" height="8" rx="4" fill="#1c3f94"/>
 <text x="912" y="492" fill="#5b6172" font-size="11" font-weight="600" letter-spacing="1">CASH REMAINING</text>
 <text x="912" y="528" fill="#1c3f94" font-size="30" font-weight="800">$6,420</text>
 <rect x="912" y="544" width="156" height="10" rx="5" fill="#efe9dd"/><rect x="912" y="544" width="106" height="10" rx="5" fill="#f2c94c"/>
 <text x="912" y="592" fill="#5b6172" font-size="11" font-weight="600" letter-spacing="1">SURCHARGE MTD</text>
 <text x="912" y="628" fill="#1c3f94" font-size="30" font-weight="800">$1,284</text>
 <rect x="912" y="660" width="156" height="120" rx="12" fill="#f7f4ee"/>
 <polyline points="924,760 948,740 972,748 996,720 1020,726 1044,700 1058,690" fill="none" stroke="#b8232f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="1058" cy="690" r="6" fill="#b8232f"/>
 <rect x="964" y="800" width="52" height="6" rx="3" fill="#cfc9be"/>
</g>
</svg>
