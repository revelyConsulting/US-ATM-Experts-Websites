<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US ATM Experts Buyer Flow — Editable Prototype</title>
<meta name="description" content="Editable, single-file copy of the US ATM Experts guided ATM buyer experience.">
<!--
  ============================================================================
  US ATM EXPERTS — GUIDED BUYER FLOW (EDITABLE PROTOTYPE)
  ============================================================================
  This is a faithful, dependency-free copy of the review prototype at
  https://us-atm-buyer-flow.usatmexperts.chatgpt.site/

  HOW TO EDIT
  -----------
  Everything a person sees — headings, helper copy, answer choices, the long
  comparison / cannabis panels, form fields, button labels and the
  branching rules — lives in ONE plain JavaScript object called FLOW, directly
  below this comment. Edit the text there and reload the file. You should not
  need to touch the rendering code (marked "ENGINE") or the CSS.

  SALESFORCE NOTES
  ----------------
  * Every step has a `salesforce` block with a suggested field API name and a
    picklist-style mapping of the choice values. These are placeholders — rename
    them to match your org's schema.
  * The answers a customer gives are collected in one flat object keyed by step
    id (see the "Captured answers" panel on the final screen). That object is the
    payload you would send to a Lead / custom object when this becomes real.
  * Nothing here transmits or stores data. It is a review prototype only.
  ============================================================================
-->
<script>
/* ============================================================================
   1. FLOW CONFIGURATION  —  edit freely
   ============================================================================ */
const FLOW = {

  brand: {
    name: "US ATM Experts",
    tagline: "Let’s find the right ATM setup.",
    pill: "Customer-flow prototype",
    footerNote: "Review prototype only · Nothing entered is transmitted or stored",
    logoAlt: "US ATM Experts"
  },

  buttons: {
    back: "Back",
    continue: "Continue",
    reviewPlan: "Review my plan",            // used on `kind: "form"` steps
    testAgain: "Test again",                 // used on `kind: "done"` steps
    selectionHint: "Choose an option to continue"     // shown instead of Continue when autoAdvance is true
  },

  /* --------------------------------------------------------------------------
     STARTING SEQUENCE
     The order of screens the customer sees until a branching rule changes it.
     Every id must exist in `steps` below.
  -------------------------------------------------------------------------- */
  startSequence: [
    "experience",
    "ownership-comparison",
    "category",
    "volume",
    "recommend",
    "programming",
    "contact",
    "done"
  ],

  /* --------------------------------------------------------------------------
     BRANCHING RULES
     Evaluated when the customer leaves a step. The FIRST matching rule wins,
     so put specific values before the "*" (any value) catch-all.
     `append` replaces everything AFTER the current step with the listed ids.
  -------------------------------------------------------------------------- */
  routes: [
    // Step 1 — only people who ask for help see the buy-vs-full-service comparison.
    { step: "experience", value: "help",
      append: ["ownership-comparison", "category", "volume", "recommend", "programming", "contact", "done"] },
    // Full service — no equipment recommendation or installation question; go straight to contact.
    { step: "experience", value: "full-service",
      append: ["category", "volume", "contact", "done"] },
    { step: "experience", value: "*",
      append: ["category", "volume", "recommend", "programming", "contact", "done"] },

    // Same rule for people who chose full service after reading the comparison.
    { step: "ownership-comparison", value: "full-service",
      append: ["category", "volume", "contact", "done"] },

    // Business type — cannabis goes to a dedicated specialist path immediately.
    { step: "category", value: "cannabis",
      append: ["cannabis-intro", "contact-cannabis", "done-cannabis"] },

    // Cannabis situation — replacing an ATM asks "what to improve", otherwise asks footprint.
    { step: "cannabis-intro", value: "replace",
      append: ["cannabis-replacement", "contact-cannabis", "done-cannabis"] },
    { step: "cannabis-intro", value: "*",
      append: ["footprint", "contact-cannabis", "done-cannabis"] },
  ],

  /* --------------------------------------------------------------------------
     STEPS
     kind:  "choices" (default) | "comparison" | "cannabis-intro" | "form" | "done"
     Steps with `choices` require a selection before Continue is enabled,
     unless the step also has rich content (comparison / cannabis-intro),
     in which case Continue is always enabled.
     autoAdvance: true  → clicking a choice moves forward immediately (no Continue button).
     variants: [...]    → conditional copy. Each entry has `when` (a list of
                          earlier { step, value } answers — ANY match applies it)
                          plus the properties to override (title, helper, choices…).
                          The first matching variant wins.
  -------------------------------------------------------------------------- */
  steps: {

    "experience": {
      eyebrow: "Interested in getting an ATM?",
      title: "Let’s find the right ATM solution for your business.",
      helper: "Tell us which statement best describes where you are in the process.",
      choices: [
        { value: "buy",          label: "I know I want to buy the ATM and service it myself.", description: "I’ll own the equipment, load the cash and manage the ATM." },
        { value: "full-service", label: "I know I want full service.",                         description: "Provide the ATM and handle the ongoing service for me." },
        { value: "help",         label: "I’m not sure. Help me decide.",                       description: "Walk me through the differences and recommend the best fit." }
      ],
      salesforce: { field: "ATM_Service_Preference__c", type: "Picklist", values: { buy: "Purchase", "full-service": "Full Service", help: "Undecided" } }
    },

    "ownership-comparison": {
      kind: "comparison",
      eyebrow: "Understand your options",
      title: "Buying an ATM vs. full service",
      helper: "Both can be good solutions. The biggest difference is how much you want to invest, manage and earn from the ATM.",
      choices: [
        { value: "buy",          label: "Buying sounds like the better fit",       description: "I’m comfortable owning and managing the ATM." },
        { value: "full-service", label: "Full service sounds like the better fit", description: "I’d rather have a provider handle the ATM." }
      ],
      // Two side-by-side cards. `sections` render as h3 + paragraphs; `bullets` render as a list.
      comparison: [
        {
          label: "Own and operate",
          heading: "Buy the ATM",
          featured: false,
          bullets: [
            "You decide what surcharge, if any, customers pay",
            "You keep 100% of any surcharge revenue",
            "You own the ATM and control how it is operated"
          ],
          intro: [
            "Some business owners set their ATM surcharge to $0 because their primary goal is providing convenient cash access—not generating ATM revenue. This is especially popular with businesses that use a cash-discount program to reduce merchant-processing costs. In those situations, the savings on credit-card processing can help offset the cost of buying the ATM.",
            "If you have a surcharge on your ATM, you keep 100% of it!"
          ],
          sections: [
            { heading: "What an ATM costs", paragraphs: [
              "Cost may be a deciding factor. Most business types can use a base-model ATM that costs approximately $2,700. That includes shipping within the contiguous United States, programming and a wireless modem.",
              "The price increases when you need the ATM to hold more cash or dispense multiple denominations. In those cases, you’re looking at approximately $3,200."
            ]},
            { heading: "What you’ll do", paragraphs: [
              "If you can operate a smartphone, you can operate an ATM. The primary tasks are loading cash into the cassette, telling the ATM how many bills you loaded, replacing the receipt paper and occasionally cleaning the cash-dispensing unit with compressed air."
            ]},
            { heading: "Warranty and service", paragraphs: [
              "ATMs are like any other piece of equipment—they can occasionally have technical issues. Parts are covered by a two-year manufacturer warranty, and our YouTube channel includes videos showing how to resolve most common issues.",
              "For anything you’re unable to resolve, our nationwide network of technicians is available to service your ATM for a fair price."
            ]},
            { heading: "Banking", paragraphs: [
              "You’ll want to check with your bank to make sure it accepts ATM settlement funds. Many national banks are not ATM-friendly. We find that local and smaller regional banks are often easier to work with."
            ]},
            { heading: "You can change course later", paragraphs: [
              "If you begin by buying and operating your ATM but later decide it’s too cumbersome, we can evaluate whether it makes sense for us to take over the cash loading and servicing through our nationwide network of vaulters."
            ]}
          ]
        },
        {
          label: "Hands-off option",
          heading: "Choose full service",
          featured: true,
          bullets: [
            "No ATM equipment purchase",
            "No cash loading or day-to-day management",
            "The provider monitors, services and repairs the ATM"
          ],
          intro: [],
          sections: [
            { heading: "How full service works", paragraphs: [
              "The sustainability of a full-service ATM is driven largely by transaction volume. An ATM generally needs more than 100 transactions per month before it begins generating a profit. Locations that remain below 100 monthly transactions can be difficult to sustain unless the provider already services several nearby ATMs.",
              "There is no way to know exactly how many transactions a new location will generate until an ATM is installed and operating. We are willing to give most locations a 90-day trial period to see how the ATM performs. After 90 days, we will review the results together and determine whether full service makes sense for the location.",
              "Revenue-sharing opportunities are normally based on the ATM’s actual performance. If earning revenue from the ATM is important to you, we can adjust the surcharge to provide revenue share from every transaction. We generally set the surcharge at $3.00 per transaction. If we set the fee any amount higher than $3.00, we can give you that amount.",
              "If the location does not generate enough transactions to sustain full service, the business owner will still have the option to purchase the ATM and continue operating it."
            ]}
          ]
        }
      ],
      salesforce: { field: "ATM_Service_Preference__c", type: "Picklist", values: { buy: "Purchase", "full-service": "Full Service" }, notes: "Overwrites the 'Undecided' value captured on the first step." }
    },

    "category": {
      eyebrow: "Your location",
      title: "Tell us about your business.",
      helper: "Choose the closest match. This helps us determine the ATM that best suits your location.",
      choices: [
        { value: "personal",    label: "Personal care services",     description: "Barber, salon, nails, tattoo or spa" },
        { value: "retail",      label: "Retail",                     description: "Convenience, smoke, liquor or specialty shop" },
        { value: "hospitality", label: "Hospitality & entertainment", description: "Bar, restaurant, club, hotel or venue" },
        { value: "cannabis",    label: "Cannabis",                   description: "Dispensary or cannabis retail" },
        { value: "other",       label: "Something else",             description: "Another customer-facing business" }
      ],
      salesforce: { field: "Business_Category__c", type: "Picklist", values: { personal: "Personal Care", retail: "Retail", hospitality: "Hospitality & Entertainment", cannabis: "Cannabis", other: "Other" } }
    },

    "volume": {
      eyebrow: "Expected usage",
      title: "How busy do you expect the ATM to be?",
      helper: "Several factors affect ATM usage. The type of business, daily customer traffic and accepted forms of payment are the major determining factors. Cash-only businesses and businesses that use a cash-discount program tend to see greater ATM transaction volume. More customers coming through your business each day generally means more transactions. We can make an initial determination based on the type of business you selected, but we need your help understanding whether you are cash-only, use a cash discount or believe another factor will drive higher ATM activity.",
      choices: [
        { value: "cash-only",     label: "We are or plan to be cash-only",          description: "Customers will need cash to complete their purchases." },
        { value: "cash-discount", label: "We have or plan to use a cash discount",   description: "Customers will be encouraged to pay with cash." },
        { value: "other-driver",  label: "We accept debit/credit but believe other factors will drive sustainable ATM transaction volume", description: "Customer traffic or another factor should support ongoing ATM usage." }
      ],
      salesforce: { field: "Expected_Volume_Driver__c", type: "Picklist", values: { "cash-only": "Cash Only", "cash-discount": "Cash Discount Program", "other-driver": "Other Traffic Driver" } }
    },

    "recommend": {
      eyebrow: "Best fit",
      title: "Recommended package: Genmega G2500 with dedicated modem",
      helper: "Sized for your expected traffic and paired with a dedicated wireless ATM modem for reliable processing and remote monitoring. US ATM Experts recommends Genmega ATMs, as we’ve found them to be the most reliable.",
      // Full-service customers don't monitor the ATM themselves, so drop that wording for them.
      variants: [
        { when: [ { step: "experience", value: "full-service" }, { step: "ownership-comparison", value: "full-service" } ],
          helper: "Sized for your expected traffic and paired with a dedicated wireless ATM modem for reliable processing. US ATM Experts recommends Genmega ATMs, as we’ve found them to be the most reliable." }
      ],
      choices: [
        { value: "yes",     label: "Use this recommendation",  description: "Continue with the suggested ATM-and-modem package" },
        { value: "compare", label: "Send me pricing options for other models", description: "" }
      ],
      salesforce: { field: "Recommendation_Response__c", type: "Picklist", values: { yes: "Accepted Recommendation", compare: "Requested Pricing for Other Models" }, notes: "In production the title/helper should be generated from category + volume." }
    },

    "programming": {
      eyebrow: "Customize your setup",
      title: "Do you want the ATM installed for you?",
      helper: "ATM installation includes bolting the ATM to the floor, bringing the ATM live, and training. This service ranges from $100–$350, depending on your location.",
      choices: [
        { value: "install", label: "Yes, install it for me",      description: "A technician bolts down the ATM, brings it live and trains your team" },
        { value: "self",    label: "No, I’ll set it up myself",    description: "You’ll receive YouTube videos covering setup and cash loading" }
      ],
      salesforce: { field: "Installation_Preference__c", type: "Picklist", values: { install: "Professional Installation", self: "Self-Install" } }
    },

    "contact": {
      kind: "form",
      eyebrow: "Almost finished",
      title: "Where should we send your personalized ATM plan?",
      helper: "For this prototype, nothing entered here will be submitted or saved.",
      fields: [
        { name: "fullName", label: "Full name",      type: "text",  placeholder: "Your name",               salesforce: "Lead.FirstName / Lead.LastName" },
        { name: "email",    label: "Business email", type: "email", placeholder: "name@business.com",       salesforce: "Lead.Email" },
        { name: "phone",    label: "Phone",          type: "tel",   placeholder: "Best number to reach you", salesforce: "Lead.Phone", fullWidth: true },
        { name: "address",  label: "Location address", type: "text", placeholder: "Street address of the ATM location", salesforce: "Lead.Street", fullWidth: true },
        { name: "city",     label: "City",           type: "text",  placeholder: "City",                    salesforce: "Lead.City" },
        { name: "state",    label: "State",          type: "text",  placeholder: "State",                   salesforce: "Lead.State" },
        { name: "zip",      label: "Zip code",       type: "text",  placeholder: "Zip code",                salesforce: "Lead.PostalCode", inputMode: "numeric" }
      ],
      salesforce: { notes: "Create Lead here. Standard path → Lead.Status = 'Open', assign to inbound sales queue. Address fields map to the Lead standard address." }
    },

    "done": {
      kind: "done",
      eyebrow: "Prototype complete",
      title: "Thank you for completing the form. A dedicated sales rep will review your information and follow up.",
      helper: "",            // leave empty to hide the line under the heading
      // completeTitle / completeText are optional — omit both to hide the checkmark box
      salesforce: { notes: "Confirmation screen. Trigger plan email / follow-up task." }
    },

    /* ------------------------- CANNABIS PATH ------------------------- */

    "cannabis-intro": {
      kind: "cannabis-intro",
      eyebrow: "ATM service for cannabis",
      title: "Cannabis locations need a different ATM setup.",
      helper: "We are the largest ATM provider in the country for the cannabis industry. We already know customer demand and transaction volume are much higher than at most other businesses, so we’ll focus on compliance and operations.",
      panels: [
        { heading: "Compliance", paragraphs: [
          "Our entire network is 100% cannabis compliant. Everyone involved—from our processors to our sponsor banks—knows when one of our terminals is located in a dispensary, so there is no risk of your ATM being shut off for non-compliance."
        ]},
        { heading: "Operations", paragraphs: [
          "Transaction volume is very high, and dispensaries tend to have a much higher average withdrawal amount than most other types of businesses. We often place ATMs that dispense multiple denominations to accommodate those higher withdrawal amounts.",
          "We also recommend at least two ATMs per location to handle the higher volume and provide redundancy. A bill jam or another technical issue should not leave your location without a working ATM while one of our technicians is on the way.",
          "Some dispensaries accept other forms of payment, and some of those options are not compliant and may be shut down. Multiple ATMs provide the safety net we recommend so customers can continue accessing cash."
        ]}
      ],
      callout: "Please select the option below that best describes your current situation.",
      choices: [
        { value: "new",     label: "We need an ATM",         description: "There is no ATM at this location today." },
        { value: "replace", label: "We’re replacing an ATM", description: "We want to improve an existing setup or change providers." },
        { value: "expand",  label: "We’re adding locations", description: "We need a repeatable setup for multiple locations." }
      ],
      salesforce: { field: "Cannabis_Situation__c", type: "Picklist", values: { new: "New ATM", replace: "Replacing ATM", expand: "Adding Locations" } }
    },

    "footprint": {
      eyebrow: "Your cannabis operation",
      title: "How many dispensary locations are involved?",
      helper: "This gives our cannabis ATM team enough context before reaching out.",
      choices: [
        { value: "one",        label: "1 location",     description: "Single-site setup" },
        { value: "small",      label: "2–10 locations", description: "Small group rollout" },
        { value: "regional",   label: "11–50 locations", description: "Regional or multi-state rollout" },
        { value: "enterprise", label: "More than 50",   description: "Enterprise deployment" }
      ],
      salesforce: { field: "Location_Count_Range__c", type: "Picklist", values: { one: "1", small: "2-10", regional: "11-50", enterprise: "50+" } }
    },

    "cannabis-replacement": {
      eyebrow: "Replacing an existing ATM",
      title: "What would you like to improve?",
      helper: "We’ve improved many dispensary ATM situations. Tell us the primary reason you’re considering a change. This helps us understand what your current ATM or provider is not delivering.",
      choices: [
        { value: "compliance",  label: "Compliance concerns",                description: "We want an ATM setup built specifically for the cannabis industry." },
        { value: "reliability", label: "Reliability or service issues",      description: "The ATM is frequently down or service takes too long." },
        { value: "capacity",    label: "Cash capacity or withdrawal limits", description: "The ATM cannot keep up with demand or larger withdrawals." },
        { value: "provider",    label: "We want a different provider",       description: "We’re dissatisfied with the current relationship or terms." },
        { value: "redundancy",  label: "We need more than one ATM",          description: "We want enough capacity and a backup when one ATM has an issue." },
        { value: "other",       label: "Something else",                     description: "Another issue is driving the change." }
      ],
      salesforce: { field: "Replacement_Reason__c", type: "Picklist", values: { compliance: "Compliance", reliability: "Reliability/Service", capacity: "Cash Capacity", provider: "Provider Change", redundancy: "Needs Redundancy", other: "Other" } }
    },

    "contact-cannabis": {
      kind: "form",
      eyebrow: "Specialist review",
      title: "Where should our cannabis ATM specialist contact you?",
      helper: "For this prototype, nothing entered here will be submitted or saved.",
      fields: [
        { name: "dispensaryName", label: "Dispensary name", type: "text", placeholder: "Name of your dispensary", salesforce: "Lead.Company", fullWidth: true },
        { name: "fullName", label: "Full name",      type: "text",  placeholder: "Your name",               salesforce: "Lead.FirstName / Lead.LastName" },
        { name: "email",    label: "Business email", type: "email", placeholder: "name@business.com",       salesforce: "Lead.Email" },
        { name: "phone",    label: "Phone",          type: "tel",   placeholder: "Best number to reach you", salesforce: "Lead.Phone", fullWidth: true }
      ],
      salesforce: { notes: "Create Lead here. Cannabis path → assign to cannabis specialist queue. Dispensary name maps to Lead.Company." }
    },

    "done-cannabis": {
      kind: "done",
      eyebrow: "Prototype complete",
      title: "A cannabis ATM specialist will follow up with you soon.",
      helper: "",            // leave empty to hide the line under the heading
      // completeTitle / completeText are optional — omit both to hide the checkmark box
      salesforce: { notes: "Confirmation screen. Create follow-up Task for specialist." }
    }
  }
};
/* ======================= end of FLOW configuration ======================= */
</script>

<style>
/* ============================================================================
   2. STYLES  —  copied from the original prototype (brand colours in :root)
   ============================================================================ */
:root{--navy:#111f4d;--navy2:#1a2e69;--red:#c9002b;--ink:#172033;--muted:#657087;--line:#dce2ec;--soft:#f5f7fb;--white:#fff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
html{background:#eef2f8;-webkit-text-size-adjust:100%;line-height:1.5}
body{color:var(--ink);background:radial-gradient(circle at top,#fff 0,#eef2f8 52%,#e6ebf3 100%);margin:0;font-family:Arial,Helvetica,sans-serif}
img{display:block;max-width:100%;height:auto}
button,input{font:inherit;color:inherit;background:transparent;border-radius:0}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline-offset:2px;outline:3px solid #c9002b40}
h1,h2,h3{font-size:inherit;font-weight:inherit}
b,strong{font-weight:bolder}
ul{list-style:none}
.site-shell{min-height:100vh;padding:32px 18px 20px}
.flow-card{background:#fff;border:1px solid #111f4d1f;border-radius:24px;width:min(850px,100%);margin:auto;overflow:hidden;box-shadow:0 24px 65px #111f4d21}
.brand-header{border-bottom:1px solid var(--line);align-items:center;gap:13px;min-height:90px;padding:14px 28px;display:flex}
.logo{object-fit:contain;border-radius:50%;width:64px;height:64px}
.brand-copy{flex-direction:column;gap:3px;display:flex}
.brand-copy strong{color:var(--navy);font-size:17px}
.brand-copy span{color:var(--muted);font-size:14px}
.prototype-pill{color:var(--navy);background:#eef2fb;border:1px solid #d8e0f2;border-radius:999px;margin-left:auto;padding:7px 11px;font-size:12px;font-weight:700}
.progress-wrap{padding:22px 32px 0}
.progress-meta{color:var(--muted);justify-content:space-between;margin-bottom:8px;font-size:12px;display:flex}
.progress-track{background:#e8ecf3;border-radius:99px;height:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--navy),var(--red));height:100%;transition:width .25s}
.screen-body{min-height:480px;padding:38px 48px 32px}
.eyebrow{color:var(--red);letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;font-size:13px;font-weight:700}
h1{max-width:680px;color:var(--navy);letter-spacing:-.035em;margin:0;font-size:clamp(30px,4.6vw,46px);line-height:1.08;font-weight:700}
.helper{max-width:680px;color:var(--muted);margin:16px 0 28px;font-size:17px;line-height:1.6}
.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;display:grid}
.choice{text-align:left;min-height:96px;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:14px;padding:17px 18px;transition:all .16s}
.choice:hover{border-color:#94a2bf;transform:translateY(-1px);box-shadow:0 8px 20px #111f4d14}
.choice.selected{color:#fff;border-color:var(--navy);background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 10px 25px #111f4d33}
.choice-title,.choice-description{display:block}
.choice-title{font-weight:700;line-height:1.3}
.choice-description{color:var(--muted);margin-top:6px;font-size:13px;line-height:1.4}
.choice.selected .choice-description{color:#ffffffc2}
.comparison-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px;display:grid}
.comparison-card{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:22px}
.comparison-card.featured{border-top:4px solid var(--red);padding-top:19px}
.option-label{color:var(--red);letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:800}
.comparison-card h2{color:var(--navy);margin:7px 0 17px;font-size:23px;font-weight:700}
.comparison-card h3{color:var(--navy);margin:16px 0 7px;font-size:13px;font-weight:700}
.comparison-card ul{color:var(--muted);margin:0;padding-left:19px;font-size:13px;line-height:1.5;list-style:disc}
.comparison-card li+li{margin-top:4px}
.comparison-card p{color:var(--muted);margin:13px 0 0;font-size:13px;line-height:1.55}
.cannabis-details{grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:14px;margin-bottom:18px;display:grid}
.cannabis-details article{border:1px solid var(--line);border-top:4px solid var(--red);background:var(--soft);border-radius:14px;padding:21px}
.cannabis-details h2{color:var(--navy);margin:0 0 10px;font-size:18px;font-weight:700}
.cannabis-details p{color:var(--muted);margin:0;font-size:14px;line-height:1.58}
.cannabis-details p+p{margin-top:12px}
.cannabis-next{border-left:4px solid var(--navy);background:#eef2fb;border-radius:0 12px 12px 0;grid-column:1/-1;padding:15px 18px;font-weight:700;color:var(--ink)!important}
.form-grid{grid-template-columns:1fr 1fr;gap:16px;display:grid}
.form-grid label{color:var(--navy);font-size:13px;font-weight:700}
.form-grid input{border:1px solid var(--line);border-radius:10px;width:100%;margin-top:8px;padding:14px;font-weight:400;display:block}
.full-field{grid-column:1/-1}
.complete-panel{background:var(--soft);border:1px solid var(--line);border-radius:14px;align-items:center;gap:16px;margin-top:30px;padding:20px;display:flex}
.checkmark{color:#fff;background:var(--navy);border-radius:50%;place-items:center;width:42px;height:42px;font-size:22px;display:grid}
.complete-panel strong{color:var(--navy)}
.complete-panel p{color:var(--muted);margin:4px 0 0}
.dev-panel{margin-top:18px;border:1px dashed #94a2bf;border-radius:12px;background:#fbfcfe;padding:14px 16px;font-size:12px;color:var(--muted)}
.dev-panel summary{cursor:pointer;font-weight:700;color:var(--navy)}
.dev-panel pre{margin-top:10px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--ink)}
.actions{border-top:1px solid var(--line);background:#fbfcfe;justify-content:space-between;align-items:center;padding:20px 32px 26px;display:flex}
.actions button{border-radius:10px;min-width:116px;padding:13px 20px;font-weight:700}
.selection-hint{color:var(--muted);font-size:13px;font-weight:700}
.primary{color:#fff;background:var(--red);border:1px solid var(--red)}
.secondary{color:var(--navy);border:1px solid var(--line);background:0 0}
.actions button:disabled{cursor:not-allowed;opacity:.4}
.review-note{text-align:center;color:#718096;font-size:12px;margin-top:14px}
@media (width<=700px){.cannabis-details{grid-template-columns:1fr}.cannabis-next{grid-column:auto}}
@media (width<=640px){
  .site-shell{padding:0}.flow-card{min-height:100vh;box-shadow:none;border:0;border-radius:0}
  .brand-header{padding:12px 18px}.logo{width:52px;height:52px}.brand-copy span{display:none}
  .prototype-pill{padding:6px 8px;font-size:10px}.progress-wrap{padding:18px 20px 0}
  .screen-body{min-height:0;padding:30px 20px 28px}.helper{font-size:16px}
  .choice-grid,.form-grid,.comparison-grid{grid-template-columns:1fr}.full-field{grid-column:auto}
  .choice{min-height:86px}.actions{padding:16px 20px;position:sticky;bottom:0}.review-note{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="site-shell">
  <section class="flow-card" aria-live="polite">
    <header class="brand-header">
      <img id="brand-logo" class="logo" alt="" src="">
      <div class="brand-copy"><strong id="brand-name"></strong><span id="brand-tagline"></span></div>
      <span class="prototype-pill" id="brand-pill"></span>
    </header>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="progress-label"></span><span id="progress-pct"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="screen-body" id="screen"></div>
    <footer class="actions">
      <button class="secondary" id="btn-back" type="button"></button>
      <span id="footer-right"></span>
    </footer>
  </section>
  <p class="review-note" id="footer-note"></p>
</main>

<script>
/* ============================================================================
   4. ENGINE  —  renders FLOW. You should not need to edit below this line.
   ============================================================================ */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let sequence = FLOW.startSequence.slice();
  let index = 0;
  let answers = {};          // { stepId: choiceValue, contact: {fullName, email, phone} }

  const currentId = () => sequence[index];

  // Returns the step definition with any matching `variants` entry merged over it.
  function resolveStep(id) {
    const base = FLOW.steps[id];
    if (!base || !base.variants) return base;
    const match = base.variants.find((v) => (v.when || []).some((c) => answers[c.step] === c.value));
    if (!match) return base;
    const { when, ...overrides } = match;
    return Object.assign({}, base, overrides);
  }
  const current = () => resolveStep(currentId());

  function findRoute(stepId, value) {
    return FLOW.routes.find((r) => r.step === stepId && r.value === value)
        || FLOW.routes.find((r) => r.step === stepId && r.value === "*");
  }

  function applyRoute(stepId, value) {
    const route = findRoute(stepId, value);
    if (route && route.append) sequence = sequence.slice(0, index + 1).concat(route.append);
  }

  function select(value) {
    const id = currentId();
    answers[id] = value;
    if (current().autoAdvance) { advance(); return; }
    render();
  }

  function advance() {
    const id = currentId();
    applyRoute(id, answers[id]);
    if (index < sequence.length - 1) index++;
    render();
  }

  function back() {
    if (index === 0) return;
    index--;
    if (index === 0) sequence = FLOW.startSequence.slice();
    render();
  }

  function reset() {
    sequence = FLOW.startSequence.slice();
    index = 0;
    answers = {};
    render();
  }

  function paragraphs(list) { return (list || []).map((p) => `<p>${esc(p)}</p>`).join(""); }

  function renderComparison(step) {
    return `<div class="comparison-grid">${step.comparison.map((card) => `
      <article class="comparison-card${card.featured ? " featured" : ""}">
        <span class="option-label">${esc(card.label)}</span>
        <h2>${esc(card.heading)}</h2>
        <h3>Advantages</h3>
        <ul>${(card.bullets || []).map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
        ${paragraphs(card.intro)}
        ${(card.sections || []).map((s) => `<h3>${esc(s.heading)}</h3>${paragraphs(s.paragraphs)}`).join("")}
      </article>`).join("")}</div>`;
  }

  function renderPanels(step, wrapClass, calloutClass) {
    return `<div class="${wrapClass}">
      ${(step.panels || []).map((p) => `<article><h2>${esc(p.heading)}</h2>${paragraphs(p.paragraphs)}</article>`).join("")}
      ${step.callout ? `<p class="${calloutClass}">${esc(step.callout)}</p>` : ""}
    </div>`;
  }

  function renderChoices(step) {
    const picked = answers[currentId()];
    return `<div class="choice-grid">${step.choices.map((c) => `
      <button type="button" class="choice${picked === c.value ? " selected" : ""}" data-value="${esc(c.value)}" aria-pressed="${picked === c.value}">
        <span class="choice-title">${esc(c.label)}</span>
        ${c.description ? `<span class="choice-description">${esc(c.description)}</span>` : ""}
      </button>`).join("")}</div>`;
  }

  function renderForm(step) {
    const saved = answers[currentId()] || {};
    return `<div class="form-grid">${step.fields.map((f) => `
      <label class="${f.fullWidth ? "full-field" : ""}">${esc(f.label)}
        <input type="${esc(f.type || "text")}" name="${esc(f.name)}" placeholder="${esc(f.placeholder || "")}" value="${esc(saved[f.name] || "")}"${f.inputMode ? ` inputmode="${esc(f.inputMode)}"` : ""} autocomplete="off">
      </label>`).join("")}</div>`;
  }

  function renderDone(step) {
    const panel = (step.completeTitle || step.completeText) ? `<div class="complete-panel">
        <span class="checkmark">✓</span>
        <div><strong>${esc(step.completeTitle || "")}</strong><p>${esc(step.completeText || "")}</p></div>
      </div>` : "";
    return `${panel}
      <details class="dev-panel">
        <summary>Captured answers (for developers)</summary>
        <pre>${esc(JSON.stringify({ path: sequence, answers }, null, 2))}</pre>
      </details>`;
  }

  function render() {
    const step = current();
    const id = currentId();
    const kind = step.kind || "choices";
    const picked = answers[id];

    $("progress-label").textContent = `Step ${index + 1} of ${sequence.length}`;
    const pct = Math.round(((index + 1) / sequence.length) * 100);
    $("progress-pct").textContent = `${pct}%`;
    $("progress-fill").style.width = `${pct}%`;

    let html = `<p class="eyebrow">${esc(step.eyebrow)}</p><h1>${esc(step.title)}</h1>${step.helper ? `<p class="helper">${esc(step.helper)}</p>` : ""}`;
    if (kind === "comparison") html += renderComparison(step);
    if (kind === "cannabis-intro") html += renderPanels(step, "cannabis-details", "cannabis-next");
    if (step.choices) html += renderChoices(step);
    if (kind === "form") html += renderForm(step);
    if (kind === "done") html += renderDone(step);
    $("screen").innerHTML = html;

    // wire choices
    $("screen").querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => select(b.dataset.value)));
    // wire form fields (kept in memory only)
    $("screen").querySelectorAll("input").forEach((inp) => inp.addEventListener("input", () => {
      answers[id] = Object.assign({}, answers[id] || {}, { [inp.name]: inp.value });
    }));

    // footer
    const backBtn = $("btn-back");
    backBtn.textContent = FLOW.buttons.back;
    backBtn.disabled = index === 0;

    const right = $("footer-right");
    if (step.autoAdvance) {
      right.innerHTML = `<span class="selection-hint">${esc(FLOW.buttons.selectionHint)}</span>`;
    } else if (kind === "done") {
      right.innerHTML = `<button class="primary" type="button" id="btn-primary">${esc(FLOW.buttons.testAgain)}</button>`;
      $("btn-primary").addEventListener("click", reset);
    } else {
      const label = kind === "form" ? FLOW.buttons.reviewPlan : FLOW.buttons.continue;
      // Continue is enabled when the step has rich content (kind set) or a choice has been made.
      const enabled = step.kind ? true : Boolean(picked);
      right.innerHTML = `<button class="primary" type="button" id="btn-primary" ${enabled ? "" : "disabled"}>${esc(label)}</button>`;
      $("btn-primary").addEventListener("click", advance);
    }
    window.scrollTo({ top: 0 });
  }

  // brand
  $("brand-logo").src = LOGO_SRC;
  $("brand-logo").alt = FLOW.brand.logoAlt;
  $("brand-name").textContent = FLOW.brand.name;
  $("brand-tagline").textContent = FLOW.brand.tagline;
  $("brand-pill").textContent = FLOW.brand.pill;
  $("footer-note").textContent = FLOW.brand.footerNote;
  $("btn-back").addEventListener("click", back);

  // expose for debugging in the console
  window.ATM_FLOW = { get sequence() { return sequence; }, get index() { return index; }, get answers() { return answers; }, reset };
  render();
})();
</script>
