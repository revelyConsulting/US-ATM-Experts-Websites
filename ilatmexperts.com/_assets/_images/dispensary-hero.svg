<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Stylized dispensary interior with product shelves, a counter, and an ATM near the entrance">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5065ab"/><stop offset="1" stop-color="#2c4699"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6275b3"/><stop offset="1" stop-color="#1f2f66"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c94c" stop-opacity=".9"/><stop offset="1" stop-color="#f2c94c" stop-opacity="0"/></linearGradient>
 <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fb77e"/><stop offset="1" stop-color="#4e8a55"/></linearGradient>
 <g id="leaf">
  <path d="M0 -60 C 12 -40, 14 -20, 4 -4 C 22 -20, 44 -26, 62 -22 C 44 -12, 30 -2, 22 8 C 40 6, 56 12, 64 24 C 46 22, 30 24, 18 30 C 30 36, 36 46, 36 58 C 22 50, 10 42, 4 32 L 4 70 L -4 70 L -4 32 C -10 42, -22 50, -36 58 C -36 46, -30 36, -18 30 C -30 24, -46 22, -64 24 C -56 12, -40 6, -22 8 C -30 -2, -44 -12, -62 -22 C -44 -26, -22 -20, -4 -4 C -14 -20, -12 -40, 0 -60 Z" fill="#6fae6b"/>
 </g>
 <g id="jarg">
  <rect x="-22" y="-40" width="44" height="60" rx="8" fill="url(#jar)"/>
  <rect x="-18" y="-48" width="36" height="12" rx="4" fill="#2c4699"/>
  <rect x="-12" y="-22" width="24" height="26" rx="4" fill="#fff" opacity=".35"/>
 </g>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<!-- floor -->
<polygon points="0,660 1600,660 1600,900 0,900" fill="url(#floor)"/>
<!-- soft ceiling lights -->

<ellipse cx="1100" cy="120" rx="220" ry="60" fill="url(#glow)" opacity=".5"/>

<g transform="translate(640,0)">
<!-- back wall shelving -->
<g>
 <rect x="270" y="260" width="470" height="16" rx="4" fill="#1f3a93"/>
 <rect x="270" y="380" width="470" height="16" rx="4" fill="#1f3a93"/>
 <rect x="270" y="500" width="470" height="16" rx="4" fill="#1f3a93"/>
 <g>
  <use href="#jarg" transform="translate(320,250)"/><use href="#jarg" transform="translate(390,250)"/><use href="#jarg" transform="translate(460,250)"/><use href="#jarg" transform="translate(530,250)"/><use href="#jarg" transform="translate(600,250)"/><use href="#jarg" transform="translate(670,250)"/>
  <use href="#jarg" transform="translate(320,370)"/><use href="#jarg" transform="translate(390,370)"/><use href="#jarg" transform="translate(460,370)"/><use href="#jarg" transform="translate(530,370)"/><use href="#jarg" transform="translate(600,370)"/><use href="#jarg" transform="translate(670,370)"/>
  <use href="#jarg" transform="translate(320,490)"/><use href="#jarg" transform="translate(390,490)"/><use href="#jarg" transform="translate(460,490)"/><use href="#jarg" transform="translate(530,490)"/><use href="#jarg" transform="translate(600,490)"/><use href="#jarg" transform="translate(670,490)"/>
 </g>
</g>

<!-- wall sign with leaf -->
<rect x="270" y="110" width="420" height="120" rx="18" fill="#1f3a93"/>
<use href="#leaf" transform="translate(340,170) scale(.8)"/>
<text x="410" y="162" fill="#f2c94c" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4">DISPENSARY</text>
<text x="410" y="198" fill="#cfd6ea" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">CASH ACCEPTED HERE</text>

<!-- counter -->
<rect x="240" y="560" width="520" height="130" rx="10" fill="#1f3a93"/>
<rect x="240" y="548" width="520" height="20" rx="6" fill="#6275b3"/>
<rect x="280" y="590" width="440" height="70" rx="6" fill="#354e9e"/>
<use href="#leaf" transform="translate(500,625) scale(.5)"/>

<!-- ATM -->
<g transform="translate(-450,0)">
 <rect x="1180" y="380" width="230" height="420" rx="18" fill="#162967"/>
 <rect x="1198" y="398" width="194" height="46" rx="8" fill="#b22234"/>
 <text x="1295" y="430" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3">ATM</text>
 <rect x="1205" y="464" width="180" height="120" rx="8" fill="#dfe9f7"/>
 <rect x="1218" y="478" width="154" height="10" rx="3" fill="#1f3a93" opacity=".6"/>
 <rect x="1218" y="498" width="110" height="8" rx="3" fill="#1f3a93" opacity=".3"/>
 <rect x="1218" y="514" width="130" height="8" rx="3" fill="#1f3a93" opacity=".3"/>
 <text x="1295" y="566" text-anchor="middle" fill="#1f3a93" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Withdraw cash</text>
 <g fill="#5065ab"><rect x="1210" y="604" width="40" height="24" rx="5"/><rect x="1258" y="604" width="40" height="24" rx="5"/><rect x="1306" y="604" width="40" height="24" rx="5"/><rect x="1210" y="636" width="40" height="24" rx="5"/><rect x="1258" y="636" width="40" height="24" rx="5"/><rect x="1306" y="636" width="40" height="24" rx="5"/></g>
 <rect x="1354" y="604" width="30" height="24" rx="5" fill="#b22234"/><rect x="1354" y="636" width="30" height="24" rx="5" fill="#f2c94c"/>
 <rect x="1205" y="690" width="180" height="22" rx="6" fill="#000" opacity=".5"/>
 <rect x="1222" y="682" width="146" height="16" rx="3" fill="#4aa46b"/>
 <rect x="1205" y="740" width="180" height="36" rx="6" fill="#354e9e"/>
</g>
</g>
<!-- floor reflections -->
<rect x="0" y="660" width="1600" height="240" fill="#fff" opacity=".03"/>
</svg>
